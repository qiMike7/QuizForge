<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizForge 考点熔炉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #66c7ea 0%, #ffffff 100%);
            min-height: 100vh;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
        }

        .login-box h2 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .login-box p {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #66ea85 0%, #4ba264 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            margin-top: 10px;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .app-container {
            display: none;
            height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            position: fixed;
            height: 100vh;
        }

        .sidebar h2 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 20px;
        }

        .user-info {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .nav-menu {
            list-style: none;
        }

        .nav-menu li {
            padding: 12px 15px;
            margin: 5px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            color: #333;
        }

        .nav-menu li:hover {
            background: #667eea;
            color: white;
        }

        .nav-menu li.active {
            background: #667eea;
            color: white;
        }

        .main-content {
            margin-left: 280px;
            padding: 30px;
            overflow-y: auto;
            height: 100vh;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 50px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s;
        }

        .upload-area:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }

        .upload-btn {
            background: linear-gradient(135deg, #6668ea 0%, #4b92a2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .question-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
            position: relative;
        }

        .question-number {
            color: #667eea;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 16px;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .options {
            margin-bottom: 15px;
        }

        .option {
            padding: 12px 15px;
            margin-bottom: 10px;
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .option.correct {
            border-color: #28a745;
            background: #d4edda;
        }

        .option.wrong {
            border-color: #dc3545;
            background: #f8d7da;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-warning {
            background: #ffc107;
            color: #333;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-info {
            background: #17a2b8;
            color: white;
        }

        .btn-small:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            background: #e7f3ff;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            display: none;
        }

        .explanation.show {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #ffffff 0%, #6690ea 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .document-list {
            margin-top: 20px;
        }

        .document-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .document-item:hover {
            background: #e9ecef;
        }

        .document-actions {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
    </style>
</head>
<body>
<div class="login-container" id="loginPage">
    <div class="login-box">
        <h2>📚 RAG复习助手</h2>
        <p>智能生成练习题，高效备考</p>

        <div class="alert alert-error" id="loginError"></div>
        <div class="alert alert-success" id="registerSuccess"></div>

        <div id="loginForm">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <button class="btn" onclick="handleLogin()">登录</button>
            <button class="btn btn-secondary" onclick="showRegister()">注册账号</button>
        </div>

        <div id="registerForm" style="display: none;">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="regUsername" placeholder="请设置用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="请设置密码">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="regConfirmPassword" placeholder="请再次输入密码">
            </div>
            <button class="btn" onclick="handleRegister()">注册</button>
            <button class="btn btn-secondary" onclick="showLogin()">返回登录</button>
        </div>
    </div>
</div>

<div class="app-container" id="appPage">
    <div class="sidebar">
        <h2>📚 RAG复习助手</h2>
        <div class="user-info">
            <span id="currentUser">用户</span>
            <button class="logout-btn" onclick="handleLogout()">退出</button>
        </div>
        <ul class="nav-menu">
            <li class="active" onclick="showSection('upload')">📤 上传文档</li>
            <li onclick="showSection('practice')">✍️ 开始练习</li>
            <li onclick="showSection('bookmarks')">⭐ 我的收藏</li>
            <li onclick="showSection('wrong')">❌ 错题本</li>
            <li onclick="showSection('progress')">📊 学习进度</li>
            <li onclick="toggleLanguage()" id="languageToggle">🌐 English</li>
        </ul>
    </div>

    <div class="main-content">
        <div id="upload" class="section active">
            <h2 style="margin-bottom: 20px; color: #667eea;">上传学习资料</h2>
            <div class="upload-area">
                <input type="file" id="fileInput" accept=".docx,.doc" onchange="handleFileSelect(event)" style="display: none;">
                <h3 style="margin-bottom: 15px; color: #667eea;">点击或拖拽上传Word文档</h3>
                <p style="color: #6c757d; margin-bottom: 20px;">支持 .docx 和 .doc 格式</p>
                <div style="margin-bottom: 15px;">
                    <label style="color: #333; font-size: 14px; display: block; margin-bottom: 8px;">📝 生成题目数量：</label>
                    <input type="number" id="questionCount" value="10" min="1" max="50"
                           style="width: 100px; padding: 10px; border: 2px solid #667eea; border-radius: 8px; text-align: center; font-size: 16px; color: #333;">
                    <span style="color: #6c757d; font-size: 12px; margin-left: 10px;">(范围: 1-50)</span>
                </div>
                <button class="upload-btn" type="button" onclick="document.getElementById('fileInput').click()">选择文件</button>
                <div id="selectedFileName" style="margin-top: 15px; color: #667eea; font-weight: bold; display: none;"></div>
                <button class="btn-small btn-success" id="uploadBtn" onclick="handleFileUpload()" style="margin-top: 15px; display: none;">开始生成题目</button>
            </div>
            <div id="uploadResult"></div>
            <div id="documentList" class="document-list"></div>
        </div>

        <div id="practice" class="section">
            <h2 style="margin-bottom: 20px; color: #667eea;">开始练习</h2>
            <div style="margin-bottom: 20px;">
                <button class="btn-small btn-primary" onclick="loadRandomQuestions()">随机抽取10题</button>
            </div>
            <div id="practiceQuestions"></div>
        </div>

        <div id="bookmarks" class="section">
            <h2 style="margin-bottom: 20px; color: #667eea;">我的收藏</h2>
            <div id="bookmarkedQuestions"></div>
        </div>

        <div id="wrong" class="section">
            <h2 style="margin-bottom: 20px; color: #667eea;">错题本</h2>
            <div id="wrongQuestions"></div>
        </div>

        <div id="progress" class="section">
            <h2 style="margin-bottom: 20px; color: #667eea;">学习进度</h2>
            <div id="progressStats"></div>
            <div style="margin-top: 30px;">
                <h3 style="margin-bottom: 15px; color: #667eea;">📊 知识掌握导图</h3>
                <button class="btn-small btn-primary" onclick="loadKnowledgeMap()" style="margin-bottom: 15px;">生成知识导图</button>
                <div id="knowledgeMap" style="background: white; border-radius: 10px; padding: 20px; min-height: 200px;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUserId = null;
    let currentQuestions = [];
    let selectedAnswers = {};
    let currentLanguage = 'zh';

    const translations = {
        zh: {
            title: 'QuizForge 考点熔炉',
            subtitle: '智能生成练习题，高效备考',
            username: '用户名',
            password: '密码',
            confirmPassword: '确认密码',
            login: '登录',
            register: '注册',
            registerAccount: '注册账号',
            backToLogin: '返回登录',
            uploadDoc: '📤 上传文档',
            startPractice: '✍️ 开始练习',
            myBookmarks: '⭐ 我的收藏',
            wrongAnswers: '❌ 错题本',
            progress: '📊 学习进度',
            language: '🌐 English',
            uploadTitle: '上传学习资料',
            uploadHint: '点击或拖拽上传Word文档',
            supportedFormat: '支持 .docx 和 .doc 格式',
            questionCount: '📝 生成题目数量：',
            range: '(范围: 1-50)',
            selectFile: '选择文件',
            generateQuestions: '开始生成题目',
            randomQuestions: '随机抽取10题',
            bookmarksTitle: '我的收藏',
            wrongTitle: '错题本',
            progressTitle: '学习进度',
            knowledgeMap: '📊 知识掌握导图',
            generateMap: '生成知识导图',
            logout: '退出'
        },
        en: {
            title: 'QuizForge',
            subtitle: 'Intelligently generate practice questions for efficient exam preparation',
            username: 'Username',
            password: 'Password',
            confirmPassword: 'Confirm Password',
            login: 'Login',
            register: 'Register',
            registerAccount: 'Register Account',
            backToLogin: 'Back to Login',
            uploadDoc: '📤 Upload Document',
            startPractice: '✍️ Start Practice',
            myBookmarks: '⭐ My Bookmarks',
            wrongAnswers: '❌ Wrong Answers',
            progress: '📊 Progress',
            language: '🌐 中文',
            uploadTitle: 'Upload Study Materials',
            uploadHint: 'Click or drag to upload Word document',
            supportedFormat: 'Supports .docx and .doc formats',
            questionCount: '📝 Number of Questions:',
            range: '(Range: 1-50)',
            selectFile: 'Select File',
            generateQuestions: 'Generate Questions',
            randomQuestions: 'Random 10 Questions',
            bookmarksTitle: 'My Bookmarks',
            wrongTitle: 'Wrong Answers',
            progressTitle: 'Learning Progress',
            knowledgeMap: '📊 Knowledge Map',
            generateMap: 'Generate Knowledge Map',
            logout: 'Logout'
        }
    };

    function toggleLanguage() {
        currentLanguage = currentLanguage === 'zh' ? 'en' : 'zh';
        localStorage.setItem('language', currentLanguage);
        applyLanguage();
    }

    function applyLanguage() {
        const t = translations[currentLanguage];

        document.querySelector('title').textContent = t.title;
        document.querySelector('.login-box h2').textContent = '📚 ' + t.title;
        document.querySelector('.login-box p').textContent = t.subtitle;

        const loginLabels = document.querySelectorAll('#loginForm .form-group label');
        loginLabels[0].textContent = t.username;
        loginLabels[1].textContent = t.password;

        const registerLabels = document.querySelectorAll('#registerForm .form-group label');
        registerLabels[0].textContent = t.username;
        registerLabels[1].textContent = t.password;
        registerLabels[2].textContent = t.confirmPassword;

        document.querySelector('#loginForm .btn').textContent = t.login;
        document.querySelector('#loginForm .btn-secondary').textContent = t.registerAccount;
        document.querySelector('#registerForm .btn').textContent = t.register;
        document.querySelector('#registerForm .btn-secondary').textContent = t.backToLogin;

        document.querySelectorAll('.nav-menu li')[0].textContent = t.uploadDoc;
        document.querySelectorAll('.nav-menu li')[1].textContent = t.startPractice;
        document.querySelectorAll('.nav-menu li')[2].textContent = t.myBookmarks;
        document.querySelectorAll('.nav-menu li')[3].textContent = t.wrongAnswers;
        document.querySelectorAll('.nav-menu li')[4].textContent = t.progress;
        document.getElementById('languageToggle').textContent = t.language;

        document.querySelector('#upload h2').textContent = t.uploadTitle;
        document.querySelector('.upload-area h3').textContent = t.uploadHint;
        document.querySelector('.upload-area p').textContent = t.supportedFormat;
        document.querySelector('#upload label').textContent = t.questionCount;
        document.querySelector('#upload span').textContent = t.range;
        document.querySelector('.upload-btn').textContent = t.selectFile;
        document.getElementById('uploadBtn').textContent = t.generateQuestions;

        document.querySelector('#practice h2').textContent = t.startPractice;
        document.querySelector('#practice .btn-small').textContent = t.randomQuestions;

        document.querySelector('#bookmarks h2').textContent = t.bookmarksTitle;
        document.querySelector('#wrong h2').textContent = t.wrongTitle;
        document.querySelector('#progress h2').textContent = t.progressTitle;
        document.querySelector('#progress h3').textContent = t.knowledgeMap;
        document.querySelector('#progress .btn-small').textContent = t.generateMap;

        document.querySelector('.logout-btn').textContent = t.logout;
    }


    function showLogin() {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
        hideAlerts();
    }

    function showRegister() {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
        hideAlerts();
    }

    function hideAlerts() {
        document.getElementById('loginError').style.display = 'none';
        document.getElementById('registerSuccess').style.display = 'none';
    }

    async function handleLogin() {
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;

        if (!username || !password) {
            showAlert('loginError', '请填写用户名和密码');
            return;
        }

        try {
            const response = await fetch('/user/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
            });

            const result = await response.text();

            if (result.startsWith('success:')) {
                currentUserId = result.substring(8);
                localStorage.setItem('userId', currentUserId);
                localStorage.setItem('username', username);
                showApp(username);
            } else {
                showAlert('loginError', result.replace('error: ', ''));
            }
        } catch (error) {
            showAlert('loginError', '登录失败: ' + error.message);
        }
    }

    async function handleRegister() {
        const username = document.getElementById('regUsername').value;
        const password = document.getElementById('regPassword').value;
        const confirmPassword = document.getElementById('regConfirmPassword').value;

        if (!username || !password) {
            showAlert('loginError', '请填写用户名和密码');
            return;
        }

        if (password !== confirmPassword) {
            showAlert('loginError', '两次密码不一致');
            return;
        }

        try {
            const response = await fetch('/user/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
            });

            const result = await response.text();

            if (result.startsWith('success:')) {
                const successAlert = document.getElementById('registerSuccess');
                successAlert.textContent = '注册成功！即将跳转到登录页面...';
                successAlert.style.display = 'block';
                document.getElementById('loginError').style.display = 'none';

                setTimeout(() => {
                    showLogin();
                    successAlert.style.display = 'none';
                }, 1500);
            } else {
                showAlert('loginError', result.replace('error: ', ''));
            }
        } catch (error) {
            showAlert('loginError', '注册失败: ' + error.message);
        }
    }


    function showApp(username) {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('appPage').style.display = 'block';
        document.getElementById('currentUser').textContent = username;
        loadDocuments();
    }

    function handleLogout() {
        currentUserId = null;
        localStorage.removeItem('userId');
        localStorage.removeItem('username');
        document.getElementById('loginPage').style.display = 'flex';
        document.getElementById('appPage').style.display = 'none';
        document.getElementById('loginUsername').value = '';
        document.getElementById('loginPassword').value = '';
    }

    function showSection(sectionName) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-menu li').forEach(li => li.classList.remove('active'));

        document.getElementById(sectionName).classList.add('active');
        event.target.classList.add('active');

        if (sectionName === 'bookmarks') loadBookmarks();
        if (sectionName === 'wrong') loadWrongQuestions();
        if (sectionName === 'progress') loadProgress();
        if (sectionName === 'upload') loadDocuments();
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            document.getElementById('selectedFileName').textContent = '📄 已选择: ' + file.name;
            document.getElementById('selectedFileName').style.display = 'block';
            document.getElementById('uploadBtn').style.display = 'inline-block';
        }
    }

    async function handleFileUpload() {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];

        if (!file) {
            showAlert('uploadResult', '请先选择文件', 'error');
            return;
        }

        const questionCount = document.getElementById('questionCount').value;

        if (!questionCount || questionCount < 1 || questionCount > 50) {
            showAlert('uploadResult', '题目数量必须在1-50之间', 'error');
            return;
        }

        const formData = new FormData();
        formData.append('file', file);
        formData.append('chatId', currentUserId);
        formData.append('numQuestions', questionCount);

        showLoading('uploadResult');

        try {
            const response = await fetch('/quiz/generate-from-document', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (result.success) {
                showAlert('uploadResult', result.message, 'success');
                currentQuestions = result.questions;
                displayQuestions(currentQuestions, 'uploadResult');
                loadDocuments();

                document.getElementById('selectedFileName').style.display = 'none';
                document.getElementById('uploadBtn').style.display = 'none';
                fileInput.value = '';
            } else {
                showAlert('uploadResult', result.message, 'error');
            }
        } catch (error) {
            showAlert('uploadResult', '上传失败: ' + error.message, 'error');
        }
    }

    async function loadRandomQuestions() {
        showLoading('practiceQuestions');

        try {
            const response = await fetch(`/quiz/list?chatId=${currentUserId}`);
            const result = await response.json();

            if (result.success && result.questions.length > 0) {
                const shuffled = result.questions.sort(() => 0.5 - Math.random());
                currentQuestions = shuffled.slice(0, 10);
                displayQuestions(currentQuestions, 'practiceQuestions');
                const container = document.getElementById('practice');
                const title = container.querySelector('h2');
                title.innerHTML = '<span style="color: #667eea;">开始练习</span>';
            } else {
                document.getElementById('practiceQuestions').innerHTML =
                    '<div class="empty-state"><p>暂无题目，请先上传文档生成题目</p></div>';
            }
        } catch (error) {
            showAlert('practiceQuestions', '加载失败: ' + error.message, 'error');
        }
    }

    function displayQuestions(questions, containerId, showRemoveDoc = false) {
        const container = document.getElementById(containerId);

        if (!questions || questions.length === 0) {
            container.innerHTML = '<div class="empty-state"><p>暂无题目</p></div>';
            return;
        }

        let html = '';
        questions.forEach((q, index) => {
            html += `
                <div class="question-card" data-question-id="${q.id}">
                    <div class="question-number">第 ${index + 1} 题</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
                        ${q.options.map((opt, optIndex) => {
                return `<div class="option" onclick="selectOption('${q.id}', ${optIndex}, this)">${String.fromCharCode(65 + optIndex)}. ${opt}</div>`;
            }).join('')}
                    </div>
                    <div class="btn-group">
                        <button class="btn-small btn-success" onclick="submitAnswer('${q.id}')">提交答案</button>
                        <button class="btn-small btn-warning" onclick="toggleBookmark('${q.id}')">收藏</button>
                    </div>
                    <div class="explanation" id="explanation-${q.id}"></div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    function selectOption(questionId, answerIndex, element) {
        selectedAnswers[questionId] = answerIndex;

        const card = element.closest('.question-card');
        card.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
        element.classList.add('selected');
    }

    async function submitAnswer(questionId) {
        const answer = selectedAnswers[questionId];

        if (answer === undefined) {
            alert('请先选择一个答案');
            return;
        }

        try {
            const response = await fetch('/quiz/submit-answer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentUserId,
                    questionId: questionId,
                    selectedAnswer: answer
                })
            });

            const result = await response.json();

            if (result.success) {
                const card = document.querySelector(`[data-question-id="${questionId}"]`);
                const options = card.querySelectorAll('.option');

                options.forEach((opt, idx) => {
                    if (idx === result.correctAnswer) {
                        opt.classList.add('correct');
                    } else if (idx === answer && !result.isCorrect) {
                        opt.classList.add('wrong');
                    }
                });

                const explanationDiv = document.getElementById(`explanation-${questionId}`);
                explanationDiv.innerHTML = `
                    <strong>${result.isCorrect ? '✅ 回答正确！' : '❌ 回答错误'}</strong><br>
                    正确答案: ${String.fromCharCode(65 + result.correctAnswer)}<br>
                    <strong>解析:</strong> ${result.explanation}
                `;
                explanationDiv.classList.add('show');
            }
        } catch (error) {
            alert('提交失败: ' + error.message);
        }
    }

    async function toggleBookmark(questionId) {
        try {
            const response = await fetch('/quiz/toggle-favorite', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentUserId,
                    questionId: questionId
                })
            });

            const result = await response.json();

            if (result.success) {
                alert(result.isFavorite ? '已加入收藏' : '已取消收藏');
                loadBookmarks();
            }
        } catch (error) {
            alert('操作失败: ' + error.message);
        }
    }

    async function loadBookmarks() {
        showLoading('bookmarkedQuestions');

        try {
            const response = await fetch(`/quiz/favorites?userId=${currentUserId}`);
            const result = await response.json();

            if (result.success) {
                const container = document.getElementById('bookmarkedQuestions');
                if (result.favorites.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>暂无收藏题目</p></div>';
                    return;
                }

                let html = '';
                result.favorites.forEach((item, index) => {
                    const q = item.question;
                    html += `
                        <div class="question-card" data-question-id="${q.id}">
                            <div class="question-number">收藏 ${index + 1}</div>
                            <div class="question-text">${q.question}</div>
                            <div class="options">
                                ${q.options.map((opt, optIndex) => {
                        return `<div class="option" onclick="selectOption('${q.id}', ${optIndex}, this)">${String.fromCharCode(65 + optIndex)}. ${opt}</div>`;
                    }).join('')}
                            </div>
                            <div class="btn-group">
                                <button class="btn-small btn-success" onclick="submitAnswer('${q.id}')">提交答案</button>
                                <button class="btn-small btn-danger" onclick="removeBookmark('${q.id}')">取消收藏</button>
                            </div>
                            <div class="explanation" id="explanation-${q.id}"></div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            }
        } catch (error) {
            showAlert('bookmarkedQuestions', '加载失败: ' + error.message, 'error');
        }
    }

    async function removeBookmark(questionId) {
        if (!confirm('确定要取消收藏吗？')) return;

        try {
            const response = await fetch('/quiz/toggle-favorite', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentUserId,
                    questionId: questionId
                })
            });

            const result = await response.json();

            if (result.success) {
                loadBookmarks();
            }
        } catch (error) {
            alert('操作失败: ' + error.message);
        }
    }

    async function loadWrongQuestions() {
        showLoading('wrongQuestions');

        try {
            const response = await fetch(`/quiz/wrong-answers?userId=${currentUserId}`);
            const result = await response.json();

            if (result.success) {
                const container = document.getElementById('wrongQuestions');

                if (result.wrongAnswers.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>太棒了！还没有错题</p></div>';
                    return;
                }

                let html = '';
                result.wrongAnswers.forEach((item, index) => {
                    const q = item.question;
                    const wrong = item.wrongAnswer;
                    html += `
                        <div class="question-card" data-question-id="${q.id}">
                            <div class="question-number">错题 ${index + 1}</div>
                            <div class="question-text">${q.question}</div>
                            <div style="color: #dc3545; margin-bottom: 10px;">
                                <strong>你的答案:</strong> ${String.fromCharCode(65 + wrong.userSelectedAnswer)} |
                                <strong>正确答案:</strong> ${String.fromCharCode(65 + wrong.correctAnswer)}
                            </div>
                            <div class="options">
                                ${q.options.map((opt, optIndex) => {
                        return `<div class="option" onclick="selectOption('${q.id}', ${optIndex}, this)">${String.fromCharCode(65 + optIndex)}. ${opt}</div>`;
                    }).join('')}
                            </div>
                            <div class="explanation show">
                                <strong>解析:</strong> ${q.explanation}
                            </div>
                            <div class="btn-group">
                                <button class="btn-small btn-danger" onclick="removeWrongAnswer('${q.id}')">移出错题本</button>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            }
        } catch (error) {
            showAlert('wrongQuestions', '加载失败: ' + error.message, 'error');
        }
    }

    async function removeWrongAnswer(questionId) {
        if (!confirm('确定要移出错题本吗？')) return;

        try {
            const response = await fetch(`/quiz/remove-wrong-answer?userId=${currentUserId}&questionId=${questionId}`, {
                method: 'DELETE'
            });

            const result = await response.json();

            if (result.success) {
                loadWrongQuestions();
            } else {
                alert(result.message || '删除失败');
            }
        } catch (error) {
            alert('操作失败: ' + error.message);
        }
    }

    async function loadProgress() {
        showLoading('progressStats');

        try {
            const response = await fetch(`/quiz/statistics?userId=${currentUserId}`);
            const result = await response.json();

            if (result.success) {
                const stats = result.statistics;
                const container = document.getElementById('progressStats');

                container.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">${stats.totalAnswered}</div>
                            <div class="stat-label">总答题数</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.totalCorrect}</div>
                            <div class="stat-label">正确数量</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.wrongCount}</div>
                            <div class="stat-label">错误数量</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.accuracy}%</div>
                            <div class="stat-label">正确率</div>
                        </div>
                    </div>
                `;
            }
        } catch (error) {
            showAlert('progressStats', '加载失败: ' + error.message, 'error');
        }
    }

    async function loadKnowledgeMap() {
        const container = document.getElementById('knowledgeMap');
        showLoading('knowledgeMap');

        try {
            const response = await fetch(`/quiz/knowledge-map?userId=${currentUserId}`);
            const result = await response.json();

            if (result.success && result.mapData) {
                let html = '<div style="font-family: monospace; line-height: 1.8;">';

                result.mapData.forEach((doc, index) => {
                    html += `
                        <div style="margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; border-left: 4px solid #667eea;">
                            <div style="font-size: 18px; font-weight: bold; color: #667eea; margin-bottom: 10px;">
                                📄 ${doc.name}
                            </div>
                            <div style="padding-left: 20px;">
                    `;

                    doc.children.forEach((q, qIndex) => {
                        html += `
                            <div style="margin: 8px 0; padding: 8px; background: white; border-radius: 5px; border-left: 3px solid #667eea;">
                                <span style="color: #6c757d;">${index + 1}.${qIndex + 1}</span>
                                ${q.name}
                            </div>
                        `;
                    });

                    html += `
                            </div>
                        </div>
                    `;
                });

                html += '</div>';
                container.innerHTML = html;
            } else {
                container.innerHTML = '<div class="empty-state"><p>暂无学习数据，请先开始练习</p></div>';
            }
        } catch (error) {
            container.innerHTML = `<div class="alert alert-error">加载失败: ${error.message}</div>`;
        }
    }

    async function loadDocuments() {
        try {
            const response = await fetch(`/quiz/list?chatId=${currentUserId}`);
            const result = await response.json();

            if (result.success && result.questions.length > 0) {
                const documentsMap = new Map();

                result.questions.forEach(q => {
                    if (!documentsMap.has(q.sourceDocument)) {
                        documentsMap.set(q.sourceDocument, []);
                    }
                    documentsMap.get(q.sourceDocument).push(q);
                });

                const container = document.getElementById('documentList');
                let html = '<h3 style="margin-bottom: 15px; color: #667eea;">📄 已上传的文档</h3>';

                documentsMap.forEach((questions, docName) => {
                    html += `
                        <div class="document-item">
                            <div onclick="loadQuestionsByDocument('${docName.replace(/'/g, "\\'")}')" style="flex: 1; cursor: pointer;">
                                <strong style="color: #333;">${docName}</strong>
                                <p style="color: #6c757d; font-size: 14px; margin-top: 5px;">共 ${questions.length} 道题目</p>
                            </div>
                            <div class="document-actions">
                                <button class="btn-small btn-info" onclick="loadQuestionsByDocument('${docName.replace(/'/g, "\\'")}')">查看</button>
                                <button class="btn-small btn-danger" onclick="removeDocument('${docName.replace(/'/g, "\\'")}')">删除</button>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } else {
                const container = document.getElementById('documentList');
                container.innerHTML = '<p style="text-align: center; color: #6c757d; padding: 20px;">暂无上传的文档</p>';
            }
        } catch (error) {
            console.error('加载文档列表失败:', error);
            const container = document.getElementById('documentList');
            container.innerHTML = '<p style="text-align: center; color: #dc3545; padding: 20px;">加载失败</p>';
        }
    }

    async function removeDocument(documentName) {
        if (!confirm(`确定要删除文档 "${documentName}" 及其所有题目吗？此操作不可恢复！`)) return;

        try {
            const response = await fetch('/quiz/delete-document', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentUserId,
                    documentName: documentName
                })
            });

            const result = await response.json();

            if (result.success) {
                loadDocuments();
                showAlert('uploadResult', result.message, 'success');
            } else {
                showAlert('uploadResult', result.message || '删除失败', 'error');
            }
        } catch (error) {
            showAlert('uploadResult', '删除失败: ' + error.message, 'error');
        }
    }



    async function loadQuestionsByDocument(documentName) {
        showLoading('practiceQuestions');
        showSectionDirectly('practice');

        try {
            const response = await fetch(`/quiz/list?chatId=${currentUserId}`);
            const result = await response.json();

            if (result.success) {
                const filtered = result.questions.filter(q => q.sourceDocument === documentName);
                currentQuestions = filtered;

                if (filtered.length > 0) {
                    displayQuestions(filtered, 'practiceQuestions');
                    const container = document.getElementById('practice');
                    const title = container.querySelector('h2');
                    title.innerHTML = `<span style="color: #667eea;">📚 ${documentName}</span> <span style="font-size: 14px; color: #6c757d;">(共${filtered.length}题)</span>`;
                } else {
                    document.getElementById('practiceQuestions').innerHTML =
                        '<div class="empty-state"><p>该文档暂无题目</p></div>';
                }
            }
        } catch (error) {
            showAlert('practiceQuestions', '加载失败: ' + error.message, 'error');
        }
    }

    function showSectionDirectly(sectionName) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-menu li').forEach(li => li.classList.remove('active'));

        document.getElementById(sectionName).classList.add('active');
        document.querySelectorAll('.nav-menu li').forEach(li => {
            if (li.textContent.includes(getSectionLabel(sectionName))) {
                li.classList.add('active');
            }
        });
    }

    function getSectionLabel(sectionName) {
        const labels = {
            'upload': '上传',
            'practice': '练习',
            'bookmarks': '收藏',
            'wrong': '错题',
            'progress': '进度'
        };
        return labels[sectionName] || '';
    }

    function showLoading(containerId) {
        document.getElementById(containerId).innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <p>加载中...</p>
            </div>
        `;
    }

    function showAlert(containerId, message, type = 'error') {
        const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
        document.getElementById(containerId).innerHTML = `
            <div class="alert ${alertClass}" style="display: block;">${message}</div>
        `;
    }

    window.onload = function() {
        const savedUserId = localStorage.getItem('userId');
        const savedUsername = localStorage.getItem('username');
        const savedLanguage = localStorage.getItem('language');

        if (savedLanguage) {
            currentLanguage = savedLanguage;
        }
        applyLanguage();

        if (savedUserId && savedUsername) {
            currentUserId = savedUserId;
            showApp(savedUsername);
        }
    };
</script>

</html>
